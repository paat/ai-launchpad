name: Deploy (manual promotion)

# Manual promotion ONLY, and only when dispatched FROM main: every job is
# gated on github.ref == refs/heads/main, the requested SHA must be a main
# ancestor, and the "production" GitHub environment must be configured with
# a main-only deployment branch policy. There is deliberately no push
# trigger and no required reviewer by default: the explicit manual dispatch
# plus the main-only policy is the approval. All actions are pinned to
# immutable commit SHAs (verified via `gh api repos/<owner>/<repo>/commits/<tag>`).
on:
  workflow_dispatch:
    inputs:
      sha:
        description: "Exact 40-hex git SHA to deploy (must be on main)"
        required: true
        type: string

permissions:
  contents: read

# Serialize deployments; never cancel one mid-flight.
concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  # Build/test/package with NO secrets and NO production environment.
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04 # ABI match for the Ubuntu 24.04 / Node 22 production host
    outputs:
      artifact_sha256: ${{ steps.package.outputs.artifact_sha256 }}
    steps:
      - name: Validate requested SHA shape
        env:
          REQ_SHA: ${{ inputs.sha }}
        run: |
          [[ "$REQ_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "sha must be 40 lowercase hex"; exit 1; }
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Prove SHA belongs to main
        env:
          REQ_SHA: ${{ inputs.sha }}
        run: |
          git fetch --no-tags origin main
          test "$(git rev-parse HEAD)" = "$REQ_SHA"
          git merge-base --is-ancestor "$REQ_SHA" "origin/main" \
            || { echo "SHA is not on main; refusing PR/arbitrary-ref code"; exit 1; }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: "22.23.3", cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # Required checks beyond unit tests: the review probes and the
      # browser suite must pass for the exact requested SHA before anything
      # is packaged (mirrors .github/workflows/ci.yml).
      - run: npm run test:probes
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - name: Package immutable release artifact
        id: package
        env:
          REQ_SHA: ${{ inputs.sha }}
        run: |
          bash -n scripts/deploy-host.sh scripts/deploy-push.sh deploy/ssh/forced-command.sh
          node scripts/deploy-package.mjs "$REQ_SHA" "release/launchpad-$REQ_SHA.tar.gz"
          echo "artifact_sha256=$(cut -d' ' -f1 "release/launchpad-$REQ_SHA.tar.gz.sha256")" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: launchpad-${{ inputs.sha }}
          path: release/
          if-no-files-found: error
          retention-days: 30

  # Only this job sees production secrets. Configure the "production"
  # environment with a main-only deployment branch policy (no required
  # reviewer by default; manual dispatch from main is the gate).
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    environment: production
    steps:
      # Deployment control script comes from the TRUSTED workflow SHA
      # (github.sha: the main head this workflow was dispatched from),
      # never from the possibly-old requested release SHA — an old SHA is
      # not proof its copy of the pipeline is the current one.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: scripts
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: launchpad-${{ inputs.sha }}
          path: release
      - name: Verify canonical artifact identity
        env:
          REQ_SHA: ${{ inputs.sha }}
          WANT: ${{ needs.build.outputs.artifact_sha256 }}
        run: |
          f="release/launchpad-$REQ_SHA.tar.gz"
          test "$(sha256sum "$f" | cut -d' ' -f1)" = "$WANT"
          test "$(cut -d' ' -f1 "$f.sha256")" = "$WANT"
      - name: Push over SSH (one stdin upload, pinned host key, forced command on host)
        env:
          REQ_SHA: ${{ inputs.sha }}
          WANT: ${{ needs.build.outputs.artifact_sha256 }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          # Secret files are removed on EVERY exit path of this step.
          trap 'rm -f ~/.ssh/deploy_key ~/.ssh/known_hosts' EXIT
          for v in DEPLOY_HOST DEPLOY_USER DEPLOY_SSH_PRIVATE_KEY DEPLOY_KNOWN_HOSTS; do
            [[ -n "${!v:-}" ]] || { echo "$v not configured in production environment; failing closed"; exit 1; }
          done
          printf '%s\n' "$DEPLOY_SSH_PRIVATE_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts && chmod 644 ~/.ssh/known_hosts
          DEPLOY_SSH_KEY_FILE=~/.ssh/deploy_key DEPLOY_KNOWN_HOSTS_FILE=~/.ssh/known_hosts \
            bash scripts/deploy-push.sh "release/launchpad-$REQ_SHA.tar.gz" "$REQ_SHA" "$WANT"
